<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img"
  aria-label="El Tío Jhony — Sullana">
  <title>El Tío Jhony — Sullana</title>
  <desc>
    Logotipo original creado para la demo de Suya Delivery. NO es el logotipo oficial del
    restaurante: sustituir por el activo que entregue El Tío Jhony.
  </desc>
  <rect width="256" height="256" rx="56" fill="#B3261E" />
  <circle cx="128" cy="112" r="66" fill="#FFF4E2" />
  <!-- Gorro de cocina -->
  <path d="M94 108 c-16 0 -26 -12 -26 -24 0 -14 12 -22 24 -20 4 -14 18 -22 32 -22 s28 8 32 22
    c12 -2 24 6 24 20 0 12 -10 24 -26 24 z" fill="#FFFFFF" stroke="#B3261E" stroke-width="5"
