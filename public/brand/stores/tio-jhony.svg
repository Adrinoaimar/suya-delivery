  <path d="M94 108 h68 v18 h-68 z" fill="#FFFFFF" stroke="#B3261E" stroke-width="5"
    stroke-linejoin="round" />
  <!-- Limón y ají: cevichería y pollería -->
  <circle cx="98" cy="146" r="14" fill="#8CC63F" />
  <path d="M148 136 c14 2 22 12 22 22 -12 2 -22 -6 -22 -22 z" fill="#0E6B44" />
  <text x="128" y="222" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Arial, sans-serif"
