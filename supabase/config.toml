# Configuración de Supabase CLI para migraciones y Edge Functions remotas.
# No define una base de datos local, puertos, Studio, SMTP ni datos de semilla.
project_id = "suya-delivery"

[db]
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

# Culqi invoca estas funciones sin JWT de Supabase; cada handler valida su solicitud.
[functions.create-culqi-order]
verify_jwt = false

[functions.charge-culqi-card]
verify_jwt = false

[functions.culqi-webhook]
verify_jwt = false

[functions.route-driving]
verify_jwt = false

[functions.manage-rider-accounts]
verify_jwt = true
