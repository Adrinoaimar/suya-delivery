name: Desplegar Izipay server-side

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente Izipay a activar
        required: true
        type: choice
        options:
          - sandbox
          - production
        default: sandbox
      confirm_production:
        description: Escribe DEPLOY_PRODUCTION solo para confirmar producción
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: izipay-${{ inputs.environment || 'sandbox' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
      IZIPAY_MERCHANT_CODE: ${{ secrets.IZIPAY_MERCHANT_CODE }}
      IZIPAY_PUBLIC_KEY: ${{ secrets.IZIPAY_PUBLIC_KEY }}
      IZIPAY_KEY_RSA: ${{ secrets.IZIPAY_KEY_RSA }}
      IZIPAY_HASH_KEY: ${{ secrets.IZIPAY_HASH_KEY }}
      IZIPAY_TOKEN_URL: ${{ secrets.IZIPAY_TOKEN_URL }}
      IZIPAY_ORDER_QUERY_URL: ${{ secrets.IZIPAY_ORDER_QUERY_URL }}
      IZIPAY_RECONCILE_SECRET: ${{ secrets.IZIPAY_RECONCILE_SECRET }}
      IZIPAY_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar configuración Izipay
        shell: bash
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          set -euo pipefail
          for name in \
            SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_SERVICE_ROLE_KEY \
            ALLOWED_ORIGINS IZIPAY_MERCHANT_CODE IZIPAY_PUBLIC_KEY IZIPAY_KEY_RSA \
            IZIPAY_HASH_KEY IZIPAY_RECONCILE_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "Falta el secreto $name." >&2
              exit 1
            fi
          done
          case ",${ALLOWED_ORIGINS}," in
            *,https://suyadelivery.com,*) ;;
            *) echo 'ALLOWED_ORIGINS no incluye https://suyadelivery.com.' >&2; exit 1 ;;
          esac
          case ",${ALLOWED_ORIGINS}," in
            *,https://rider.suyadelivery.com,*) ;;
            *) echo 'ALLOWED_ORIGINS no incluye https://rider.suyadelivery.com.' >&2; exit 1 ;;
          esac
          case ",${ALLOWED_ORIGINS}," in
            *,https://panel.suyadelivery.com,*) ;;
            *) echo 'ALLOWED_ORIGINS no incluye https://panel.suyadelivery.com.' >&2; exit 1 ;;
          esac
          for origin in https://localhost capacitor://localhost; do
            case ",${ALLOWED_ORIGINS}," in
              *,${origin},*) ;;
              *) echo "ALLOWED_ORIGINS no incluye ${origin} para la APK móvil." >&2; exit 1 ;;
            esac
          done
          if [[ "$IZIPAY_ENVIRONMENT" == 'production' && "$CONFIRM_PRODUCTION" != 'DEPLOY_PRODUCTION' ]]; then
            echo 'Producción requiere confirm_production=DEPLOY_PRODUCTION.' >&2
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Aplicar migraciones Supabase
        run: >-
          supabase db push
          --project-ref cggxooilzhqlcnofgtmi
          --password "$SUPABASE_DB_PASSWORD"
          --skip-vault
          --yes

      - name: Configurar secretos Izipay en Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          api_base='https://sandbox-api-pw.izipay.pe'
          if [[ "$IZIPAY_ENVIRONMENT" == 'production' ]]; then
            api_base='https://api-pw.izipay.pe'
          fi
          token_url="${IZIPAY_TOKEN_URL:-$api_base/security/v1/Token/Generate}"
          order_query_url="${IZIPAY_ORDER_QUERY_URL:-$api_base/orderinfo/v1/Transaction/Search}"
          secret_file="$RUNNER_TEMP/suya-izipay.env"
          umask 077
          {
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'ALLOWED_ORIGINS=%s\n' "$ALLOWED_ORIGINS"
            printf 'IZIPAY_MERCHANT_CODE=%s\n' "$IZIPAY_MERCHANT_CODE"
            printf 'IZIPAY_PUBLIC_KEY=%s\n' "$IZIPAY_PUBLIC_KEY"
            printf 'IZIPAY_KEY_RSA=%s\n' "$IZIPAY_KEY_RSA"
            printf 'IZIPAY_HASH_KEY=%s\n' "$IZIPAY_HASH_KEY"
            printf 'IZIPAY_TOKEN_URL=%s\n' "$token_url"
            printf 'IZIPAY_ORDER_QUERY_URL=%s\n' "$order_query_url"
            printf 'IZIPAY_RECONCILE_SECRET=%s\n' "$IZIPAY_RECONCILE_SECRET"
            printf 'IZIPAY_ENVIRONMENT=%s\n' "$IZIPAY_ENVIRONMENT"
          } > "$secret_file"
          trap 'rm -f "$secret_file"' EXIT
          supabase secrets set \
            --project-ref cggxooilzhqlcnofgtmi \
            --env-file "$secret_file"

      - name: Desplegar funciones Izipay
        run: |
          set -euo pipefail
          supabase functions deploy create-izipay-payment --project-ref cggxooilzhqlcnofgtmi
          supabase functions deploy izipay-webhook --project-ref cggxooilzhqlcnofgtmi
          supabase functions deploy reconcile-izipay-payments --project-ref cggxooilzhqlcnofgtmi

      - name: Comprobar que los endpoints existen
        shell: bash
        run: |
          set -euo pipefail
          base='https://cggxooilzhqlcnofgtmi.supabase.co/functions/v1'
          for function_name in create-izipay-payment izipay-webhook reconcile-izipay-payments; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --max-time 20 -X OPTIONS "$base/$function_name" \
              -H 'Origin: https://suyadelivery.com')
            case "$status" in
              404) echo "$function_name no está desplegada (404)." >&2; exit 1 ;;
              200|204|401|405|403|503) echo "$function_name: HTTP $status" ;;
              *) echo "$function_name respondió HTTP $status." >&2; exit 1 ;;
            esac
          done

      - name: Ejecutar smoke sandbox sin cobro
        if: ${{ inputs.environment == 'sandbox' }}
        env:
          IZIPAY_ENVIRONMENT: sandbox
          IZIPAY_MERCHANT_CODE: ${{ secrets.IZIPAY_MERCHANT_CODE }}
          IZIPAY_PUBLIC_KEY: ${{ secrets.IZIPAY_PUBLIC_KEY }}
          IZIPAY_TOKEN_URL: ${{ secrets.IZIPAY_TOKEN_URL }}
          IZIPAY_ORDER_QUERY_URL: ${{ secrets.IZIPAY_ORDER_QUERY_URL }}
        run: node scripts/verify-izipay-sandbox.mjs
