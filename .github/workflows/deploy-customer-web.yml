name: Deploy Suya customer and backoffice web

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suya-web-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    env:
      CI: 'true'
      VITE_BACKEND: supabase
      VITE_MAP_PROVIDER: osm
      VITE_ANALYTICS_PROVIDER: suya
      VITE_ROUTING_URL: https://cggxooilzhqlcnofgtmi.supabase.co/functions/v1/route-driving
      VITE_OSM_DARK_TILE_URL: https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.VITE_EXPECTED_SUPABASE_PROJECT_REF }}
      VITE_CUSTOMER_APP_URL: ${{ vars.VITE_CUSTOMER_APP_URL }}
      VITE_RIDER_APP_URL: ${{ vars.VITE_RIDER_APP_URL }}
      VITE_BACKOFFICE_APP_URL: ${{ vars.VITE_BACKOFFICE_APP_URL }}
      VITE_OSM_TILE_URL: ${{ vars.VITE_OSM_TILE_URL }}
      VITE_CULQI_GATEWAY_ENABLED: 'false'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_CUSTOMER_PROJECT: suya-customer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Gates de configuración y código
        run: |
          node scripts/check-cloudflare-config.mjs --deployment
          npm run security:secrets
          npm run typecheck
          npm run lint
          # The config contract tests intentionally start from a clean local env;
          # production values are only needed by the deployment/build steps.
          env -u VITE_CULQI_GATEWAY_ENABLED \
            -u VITE_CULQI_PUBLIC_KEY \
            -u VITE_ANALYTICS_PROVIDER \
            -u VITE_CUSTOMER_APP_URL \
            -u VITE_RIDER_APP_URL \
            -u VITE_BACKOFFICE_APP_URL \
            npm run test

      - name: Construir cliente y Backoffice reales
        run: |
          npm run build:customer
          npm run build:backoffice
          npm run verify:production

      - name: Publicar cliente en producción
        run: >-
          npx --yes wrangler@4.123.0 pages deploy dist/customer
          --project-name=suya-customer
          --branch=main
          --commit-hash=${{ github.sha }}
          --commit-dirty=false

      - name: Publicar Backoffice en producción
        run: >-
          npx --yes wrangler@4.123.0 pages deploy dist/backoffice
          --project-name=suya-backoffice
          --branch=main
          --commit-hash=${{ github.sha }}
          --commit-dirty=false

      - name: Smoke público
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 https://suyadelivery.com/ >/dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 https://suyadelivery.com/help >/dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 https://panel.suyadelivery.com/login >/dev/null
