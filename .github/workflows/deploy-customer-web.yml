name: Deploy Suya customer web

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suya-customer-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    env:
      CI: 'true'
      VITE_BACKEND: supabase
      VITE_MAP_PROVIDER: osm
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.VITE_EXPECTED_SUPABASE_PROJECT_REF }}
      VITE_CUSTOMER_APP_URL: ${{ vars.VITE_CUSTOMER_APP_URL }}
      VITE_RIDER_APP_URL: ${{ vars.VITE_RIDER_APP_URL }}
      VITE_BACKOFFICE_APP_URL: ${{ vars.VITE_BACKOFFICE_APP_URL }}
      VITE_OSM_TILE_URL: ${{ vars.VITE_OSM_TILE_URL }}
      VITE_CULQI_GATEWAY_ENABLED: 'false'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_CUSTOMER_PROJECT: suya-customer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Gates de configuración y código
        run: |
          node scripts/check-cloudflare-config.mjs --deployment
          npm run security:secrets
          npm run typecheck
          npm run lint
          npm run test

      - name: Construir cliente real
        run: |
          npm run build:customer
          npm run verify:production

      - name: Publicar cliente en producción
        run: >-
          npx --yes wrangler@4.123.0 pages deploy dist/customer
          --project-name=suya-customer
          --branch=main
          --commit-hash=${{ github.sha }}
          --commit-dirty=false

      - name: Smoke público
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 https://suyadelivery.com/ >/dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 https://suyadelivery.com/help >/dev/null
