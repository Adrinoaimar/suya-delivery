name: E2E multiapp

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/functional-suya-loop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      CI_E2E: 'true'
      VITE_BACKEND: supabase
      VITE_MAP_PROVIDER: osm
      VITE_EXPECTED_SUPABASE_PROJECT_REF: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Iniciar Supabase local real
        run: npm run db:start
      - name: Cargar credenciales públicas locales
        shell: bash
        run: |
          npx supabase status -o json > "$RUNNER_TEMP/supabase.json"
          api_url=$(jq -r '.API_URL // .api_url // empty' "$RUNNER_TEMP/supabase.json")
          anon_key=$(jq -r '.ANON_KEY // .anon_key // empty' "$RUNNER_TEMP/supabase.json")
          test -n "$api_url"
          test -n "$anon_key"
          {
            echo "VITE_SUPABASE_URL=$api_url"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$anon_key"
          } >> "$GITHUB_ENV"
      - run: npm run build:apps
      - name: Instalar Chromium real
        run: npx playwright install --with-deps chromium
      - name: Servir las tres apps
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --outDir dist/customer > "$RUNNER_TEMP/customer.log" 2>&1 &
          npm run preview -- --host 127.0.0.1 --port 4174 --outDir dist/rider > "$RUNNER_TEMP/rider.log" 2>&1 &
          npm run preview -- --host 127.0.0.1 --port 4175 --outDir dist/backoffice > "$RUNNER_TEMP/backoffice.log" 2>&1 &
          for port in 4173 4174 4175; do
            for attempt in $(seq 1 30); do
              curl --fail --silent "http://127.0.0.1:$port/" >/dev/null && break
              sleep 1
            done
            curl --fail --silent "http://127.0.0.1:$port/"
          done
      - run: npm run test:e2e
      - name: Detener Supabase
        if: always()
        run: npm run db:stop

