name: Verificar frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # No se cancela un despliegue a medias: se deja terminar el que ya está publicando.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verificar tipos, estilo y pruebas
        run: |
          npm run security:secrets
          npm run typecheck
          npm run lint
          npm run test

      # La publicación real pasa por cloudflare-pages.yml con Supabase y secretos verificados.

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      # El build seguro rechaza mocks. Este job solo abre pantallas estáticas
      # en Playwright, así que usa el modo E2E explícito y un endpoint local.
      CI_E2E: 'true'
      VITE_BACKEND: supabase
      VITE_MAP_PROVIDER: osm
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_EXPECTED_SUPABASE_PROJECT_REF: local
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_e2e_only_placeholder_12345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:apps

      - name: Instalar Chromium real
        run: npx playwright install --with-deps chromium

      - name: Servir las tres apps
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --outDir dist/customer > "$RUNNER_TEMP/customer.log" 2>&1 &
          npm run preview -- --host 127.0.0.1 --port 4174 --outDir dist/rider > "$RUNNER_TEMP/rider.log" 2>&1 &
          npm run preview -- --host 127.0.0.1 --port 4175 --outDir dist/backoffice > "$RUNNER_TEMP/backoffice.log" 2>&1 &
          for port in 4173 4174 4175; do
            for attempt in $(seq 1 30); do
              curl --fail --silent "http://127.0.0.1:$port/" >/dev/null && break
              sleep 1
            done
            curl --fail --silent "http://127.0.0.1:$port/"
          done

      - run: npm run test:e2e
