name: Verificar frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # No se cancela un despliegue a medias: se deja terminar el que ya está publicando.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verificar tipos, estilo y pruebas
        run: |
          npm run security:secrets
          npm run typecheck
          npm run lint
          npm run test

      # La publicación real pasa por cloudflare-pages.yml con Supabase y secretos verificados.

