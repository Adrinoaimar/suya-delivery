name: Deploy a GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # No se cancela un despliegue a medias: se deja terminar el que ya está publicando.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verificar tipos, estilo y pruebas
        run: |
          npm run security:secrets
          npm run typecheck
          npm run lint
          npm run test

      # GitHub Pages sirve el proyecto bajo /<repo>/. Se toma de GITHUB_REPOSITORY
      # ("owner/repo") porque está definido en cualquier evento, también en
      # workflow_dispatch, donde el payload del evento puede no traer el repositorio.
      - name: Calcular la base del sitio
        run: echo "VITE_BASE=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      - name: Construir sitio
        run: |
          npm run build:pages
          npm run build:apps

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
