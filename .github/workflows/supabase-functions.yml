name: Desplegar Edge Functions Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VITE_CULQI_GATEWAY_ENABLED: ${{ secrets.VITE_CULQI_GATEWAY_ENABLED || 'false' }}
      CULQI_SECRET_KEY: ${{ secrets.CULQI_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
      CULQI_WEBHOOK_USERNAME: ${{ secrets.CULQI_WEBHOOK_USERNAME }}
      CULQI_WEBHOOK_PASSWORD: ${{ secrets.CULQI_WEBHOOK_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar credenciales y orígenes de producción
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$ALLOWED_ORIGINS"
          case "$VITE_CULQI_GATEWAY_ENABLED" in
            false) ;;
            true)
              test -n "$CULQI_SECRET_KEY"
              test -n "$CULQI_WEBHOOK_USERNAME"
              test -n "$CULQI_WEBHOOK_PASSWORD"
              ;;
            *) echo "VITE_CULQI_GATEWAY_ENABLED debe ser true o false." >&2; exit 1 ;;
          esac
          for origin in \
            https://suyadelivery.com \
            https://rider.suyadelivery.com \
            https://panel.suyadelivery.com \
            https://localhost \
            capacitor://localhost; do
            case ",${ALLOWED_ORIGINS}," in
              *,${origin},*) ;;
              *) echo "Falta origen permitido: ${origin}" >&2; exit 1 ;;
            esac
          done
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Aplicar migraciones remotas
        run: >-
          supabase db push
          --project-ref cggxooilzhqlcnofgtmi
          --password "$SUPABASE_DB_PASSWORD"
          --skip-vault
          --yes
      - name: Configurar secretos de Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/suya-edge-functions.env"
          umask 077
          {
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'ALLOWED_ORIGINS=%s\n' "$ALLOWED_ORIGINS"
            if [ "$VITE_CULQI_GATEWAY_ENABLED" = "true" ]; then
              printf 'CULQI_SECRET_KEY=%s\n' "$CULQI_SECRET_KEY"
              printf 'CULQI_WEBHOOK_USERNAME=%s\n' "$CULQI_WEBHOOK_USERNAME"
              printf 'CULQI_WEBHOOK_PASSWORD=%s\n' "$CULQI_WEBHOOK_PASSWORD"
            fi
          } > "$secret_file"
          trap 'rm -f "$secret_file"' EXIT
          supabase secrets set \
            --project-ref cggxooilzhqlcnofgtmi \
            --env-file "$secret_file"
      - name: Desplegar invitación de propietarios
        run: supabase functions deploy invite-restaurant-owner --project-ref cggxooilzhqlcnofgtmi
      - name: Desplegar invitación de repartidores
        run: supabase functions deploy invite-restaurant-rider --project-ref cggxooilzhqlcnofgtmi
      - name: Desplegar creación de orden Culqi
        run: supabase functions deploy create-culqi-order --project-ref cggxooilzhqlcnofgtmi
      - name: Desplegar cobro de tokens Culqi (tarjeta/Yape)
        run: supabase functions deploy charge-culqi-card --project-ref cggxooilzhqlcnofgtmi
      - name: Desplegar webhook Culqi
        run: supabase functions deploy culqi-webhook --project-ref cggxooilzhqlcnofgtmi
      - name: Desplegar rutas viales autenticadas
        run: supabase functions deploy route-driving --project-ref cggxooilzhqlcnofgtmi
      - name: Auditar migraciones y funciones live
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          node scripts/verify-live-production.mjs --functions-only
