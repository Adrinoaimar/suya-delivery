name: Desplegar Edge Functions Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar token de despliegue
        run: test -n "$SUPABASE_ACCESS_TOKEN"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Desplegar invitación de propietarios
        run: supabase functions deploy invite-restaurant-owner --project-ref cggxooilzhqlcnofgtmi
