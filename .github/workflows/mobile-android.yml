name: Compilar Suya Android

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mobile-android.yml'
      - 'android/**'
      - 'apps/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-android.yml'
      - 'android/**'
      - 'apps/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      VITE_BACKEND: supabase
      VITE_MAP_PROVIDER: osm
      VITE_ROUTING_URL: https://cggxooilzhqlcnofgtmi.supabase.co/functions/v1/route-driving
      VITE_OSM_DARK_TILE_URL: https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png
      VITE_SUPABASE_URL: https://cggxooilzhqlcnofgtmi.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_EXPECTED_SUPABASE_PROJECT_REF: cggxooilzhqlcnofgtmi
      VITE_CUSTOMER_APP_URL: https://suyadelivery.com
      VITE_RIDER_APP_URL: https://rider.suyadelivery.com
      VITE_BACKOFFICE_APP_URL: https://panel.suyadelivery.com
      VITE_CULQI_GATEWAY_ENABLED: ${{ secrets.VITE_CULQI_GATEWAY_ENABLED }}
      VITE_CULQI_PUBLIC_KEY: ${{ secrets.VITE_CULQI_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          # The action default still includes the removed legacy `tools` package.
          # Install only the supported platform-tools here; the next step pins
          # the exact platform and build-tools versions used by this project.
          packages: platform-tools

      - name: Instalar SDK Android requerido
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - run: npm ci

      - name: Verificar secretos y compilar APKs por rol
        run: |
          npm run security:secrets
          npm run build:mobile:roles

      - name: Auditar APKs generados
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          aapt2_path="$build_tools/aapt2"
          apksigner_path="$build_tools/apksigner"
          test -n "$aapt2_path"
          test -n "$apksigner_path"
          test -x "$aapt2_path"
          test -x "$apksigner_path"
          npm run verify:android-apks -- --aapt2 "$aapt2_path" --apksigner "$apksigner_path"

      - name: Regresión Android Keystore en emulador API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          # Keystore y las regresiones instrumentadas no necesitan Google
          # Play Services; ATD reduce el arranque inestable del runner Linux.
          target: aosp_atd
          script: bash android/gradlew -p android :app:connectedDebugAndroidTest --no-daemon

      - name: Publicar APK de repartidor
        uses: actions/upload-artifact@v4
        with:
          name: Suya-Rider-debug-${{ github.sha }}
          path: output/android/Suya-Rider-*-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK de cliente
        uses: actions/upload-artifact@v4
        with:
          name: Suya-Cliente-debug-${{ github.sha }}
          path: output/android/Suya-Cliente-*-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK de backoffice
        uses: actions/upload-artifact@v4
        with:
          name: Suya-Backoffice-debug-${{ github.sha }}
          path: output/android/Suya-Backoffice-*-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK de sincronización de caja
        uses: actions/upload-artifact@v4
        with:
          name: Suya-Wallet-Observer-debug-${{ github.sha }}
          path: output/android/Suya-Wallet-Observer-*-debug.apk
          if-no-files-found: error
          retention-days: 14
