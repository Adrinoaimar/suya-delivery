name: Compilar Suya Android

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mobile-android.yml'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-android.yml'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      VITE_BACKEND: supabase
      VITE_MAP_PROVIDER: osm
      VITE_SUPABASE_URL: https://cggxooilzhqlcnofgtmi.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_EXPECTED_SUPABASE_PROJECT_REF: cggxooilzhqlcnofgtmi
      VITE_CUSTOMER_APP_URL: https://suya-customer.pages.dev
      VITE_RIDER_APP_URL: https://suya-rider.pages.dev
      VITE_BACKOFFICE_APP_URL: https://suya-backoffice.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Instalar SDK Android requerido
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - run: npm ci

      - name: Verificar código y preparar bundle móvil
        run: |
          npm run security:secrets
          npm run build:mobile

      - name: Compilar APK debug
        run: bash android/gradlew -p android assembleDebug --no-daemon

      - name: Publicar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: Suya-Android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Compilar release sin firma
        run: bash android/gradlew -p android assembleRelease --no-daemon

      - name: Publicar APK release sin firma
        uses: actions/upload-artifact@v4
        with:
          name: Suya-Android-release-unsigned-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
