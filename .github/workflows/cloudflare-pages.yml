name: Desplegar Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'public/**'
      - 'src/**'
      - 'scripts/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:
    inputs:
      allow_initial_release:
        description: Permitir primera publicación sin rollback previo
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    env:
      CI: 'true'
      VITE_BACKEND: supabase
      VITE_MAP_PROVIDER: osm
      VITE_ANALYTICS_PROVIDER: suya
      VITE_ROUTING_URL: https://cggxooilzhqlcnofgtmi.supabase.co/functions/v1/route-driving
      VITE_OSM_DARK_TILE_URL: https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.VITE_EXPECTED_SUPABASE_PROJECT_REF }}
      VITE_CUSTOMER_APP_URL: ${{ vars.VITE_CUSTOMER_APP_URL }}
      VITE_RIDER_APP_URL: ${{ vars.VITE_RIDER_APP_URL }}
      VITE_BACKOFFICE_APP_URL: ${{ vars.VITE_BACKOFFICE_APP_URL }}
      VITE_OSM_TILE_URL: ${{ vars.VITE_OSM_TILE_URL }}
      VITE_CULQI_GATEWAY_ENABLED: ${{ secrets.VITE_CULQI_GATEWAY_ENABLED || 'false' }}
      VITE_CULQI_PUBLIC_KEY: ${{ secrets.VITE_CULQI_PUBLIC_KEY || '' }}
      ALLOWED_ORIGINS: https://suyadelivery.com,https://rider.suyadelivery.com,https://panel.suyadelivery.com,https://localhost,capacitor://localhost
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUYA_LIVE_UPDATE_PRIVATE_KEY: ${{ secrets.SUYA_LIVE_UPDATE_PRIVATE_KEY }}
      CLOUDFLARE_CUSTOMER_PROJECT: ${{ vars.CLOUDFLARE_CUSTOMER_PROJECT || 'suya-customer' }}
      CLOUDFLARE_RIDER_PROJECT: ${{ vars.CLOUDFLARE_RIDER_PROJECT || 'suya-rider' }}
      CLOUDFLARE_BACKOFFICE_PROJECT: ${{ vars.CLOUDFLARE_BACKOFFICE_PROJECT || 'suya-backoffice' }}
      SUYA_ALLOW_INITIAL_RELEASE: ${{ inputs.allow_initial_release }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Gates de código y configuración
        run: |
          node scripts/check-cloudflare-config.mjs --deployment
          npm run security:secrets
          npm run typecheck
          npm run lint
          # Las pruebas de dominio usan servicios mock; no deben heredar las
          # credenciales/configuración productivas del job de publicación.
          env \
            -u VITE_BACKEND \
            -u VITE_SUPABASE_URL \
            -u VITE_SUPABASE_PUBLISHABLE_KEY \
            -u VITE_EXPECTED_SUPABASE_PROJECT_REF \
            -u VITE_ANALYTICS_PROVIDER \
            -u VITE_CULQI_GATEWAY_ENABLED \
            -u VITE_CULQI_PUBLIC_KEY \
            -u VITE_ROUTING_URL \
            -u VITE_CUSTOMER_APP_URL \
            -u VITE_RIDER_APP_URL \
            -u VITE_BACKOFFICE_APP_URL \
            npm run test

      - name: Verificar Edge Functions de pagos y rutas
        run: npm run verify:payments -- --network

      - name: Construir y rechazar simulaciones
        run: |
          npm run build:apps
          node scripts/build-apps.mjs mobile
          node scripts/build-apps.mjs walletobserver
          npm run prepare:mobile-live-update
          npm run verify:production

      - name: Verificar proyectos Pages existentes
        run: |
          npx --yes wrangler@4.123.0 pages project list --json > "$RUNNER_TEMP/pages-projects.json"
          node scripts/check-cloudflare-config.mjs --deployment --projects "$RUNNER_TEMP/pages-projects.json"

      - name: Publicar candidatos, probar y promover con rollback
        run: node scripts/release-cloudflare-pages.mjs
