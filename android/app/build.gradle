apply plugin: 'com.android.application'

def suyaAndroidAppId = System.getenv('SUYA_ANDROID_APP_ID') ?: 'com.suya.app'
def suyaAndroidAppName = System.getenv('SUYA_ANDROID_APP_NAME') ?: 'Suya'
def suyaWalletObserverEnabled = suyaAndroidAppId == 'com.suya.walletobserver' ? 'true' : 'false'
def suyaSupabaseUrl = (System.getenv('VITE_SUPABASE_URL') ?: '').replace('\\', '\\\\').replace('"', '\\"')
def suyaSupabasePublishableKey = (System.getenv('VITE_SUPABASE_PUBLISHABLE_KEY') ?: '').replace('\\', '\\\\').replace('"', '\\"')
def suyaReleaseSigning = [
    SUYA_RELEASE_STORE_FILE: System.getenv('SUYA_RELEASE_STORE_FILE'),
    SUYA_RELEASE_STORE_PASSWORD: System.getenv('SUYA_RELEASE_STORE_PASSWORD'),
    SUYA_RELEASE_KEY_ALIAS: System.getenv('SUYA_RELEASE_KEY_ALIAS'),
    SUYA_RELEASE_KEY_PASSWORD: System.getenv('SUYA_RELEASE_KEY_PASSWORD'),
]
def suyaSigningProvided = suyaReleaseSigning.values().any { it != null && !it.isEmpty() }
def suyaSigningComplete = suyaReleaseSigning.values().every { it != null && !it.isEmpty() }
if (suyaSigningProvided && !suyaSigningComplete) {
    def missing = suyaReleaseSigning.findAll { key, value -> value == null || value.isEmpty() }.keySet()
    throw new GradleException("Firma release incompleta: faltan ${missing.join(', ')}")
}
if (suyaSigningComplete && !file(suyaReleaseSigning.SUYA_RELEASE_STORE_FILE).isFile()) {
    throw new GradleException('Firma release: el archivo SUYA_RELEASE_STORE_FILE no existe')
}

android {
    namespace = "com.suya.app"
    buildFeatures {
        buildConfig true
    }
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        if (suyaSigningComplete) {
            release {
                storeFile file(suyaReleaseSigning.SUYA_RELEASE_STORE_FILE)
                storePassword suyaReleaseSigning.SUYA_RELEASE_STORE_PASSWORD
                keyAlias suyaReleaseSigning.SUYA_RELEASE_KEY_ALIAS
                keyPassword suyaReleaseSigning.SUYA_RELEASE_KEY_PASSWORD
            }
        }
    }
    defaultConfig {
        applicationId suyaAndroidAppId
        manifestPlaceholders = [
            suyaAppName: suyaAndroidAppName,
            suyaWalletObserverEnabled: suyaWalletObserverEnabled,
        ]
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Fuerza el retorno al bundle nativo al actualizar una instalación que
        // pudiera tener pendiente el OTA incorrecto de Suya Cliente.
        versionCode 8
        versionName "1.7"
        buildConfigField "String", "SUYA_SUPABASE_URL", "\"${suyaSupabaseUrl}\""
        buildConfigField "String", "SUYA_SUPABASE_PUBLISHABLE_KEY", "\"${suyaSupabasePublishableKey}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            if (suyaSigningComplete) {
                signingConfig signingConfigs.release
            }
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
