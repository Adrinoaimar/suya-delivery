apply plugin: 'com.android.application'

def suyaAndroidAppId = System.getenv('SUYA_ANDROID_APP_ID') ?: 'com.suya.app'
def suyaAndroidAppName = System.getenv('SUYA_ANDROID_APP_NAME') ?: 'Suya'
def suyaWalletObserverEnabled = suyaAndroidAppId == 'com.suya.walletobserver' ? 'true' : 'false'
def suyaSupabaseUrl = (System.getenv('VITE_SUPABASE_URL') ?: '').replace('\\', '\\\\').replace('"', '\\"')
def suyaSupabasePublishableKey = (System.getenv('VITE_SUPABASE_PUBLISHABLE_KEY') ?: '').replace('\\', '\\\\').replace('"', '\\"')
def suyaReleaseSigning = [
    storeFile: System.getenv('SUYA_RELEASE_STORE_FILE')?.trim(),
    storePassword: System.getenv('SUYA_RELEASE_STORE_PASSWORD'),
    keyAlias: System.getenv('SUYA_RELEASE_KEY_ALIAS')?.trim(),
    keyPassword: System.getenv('SUYA_RELEASE_KEY_PASSWORD'),
]
def suyaReleaseSigningConfigured = suyaReleaseSigning.values().every { it }
def hasPartialReleaseSigning = suyaReleaseSigning.values().any { it } && !suyaReleaseSigningConfigured

if (hasPartialReleaseSigning) {
    throw new GradleException('La firma release de Suya está incompleta; configura las cuatro variables SUYA_RELEASE_*.')
}
if (suyaReleaseSigningConfigured && !project.file(suyaReleaseSigning.storeFile).isFile()) {
    throw new GradleException('SUYA_RELEASE_STORE_FILE debe señalar un keystore existente.')
}

android {
    namespace = "com.suya.app"
    buildFeatures {
        buildConfig true
    }
    if (suyaReleaseSigningConfigured) {
        signingConfigs {
            release {
                storeFile project.file(suyaReleaseSigning.storeFile)
                storePassword suyaReleaseSigning.storePassword
                keyAlias suyaReleaseSigning.keyAlias
                keyPassword suyaReleaseSigning.keyPassword
            }
        }
    }
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId suyaAndroidAppId
        manifestPlaceholders = [
            suyaAppName: suyaAndroidAppName,
            suyaWalletObserverEnabled: suyaWalletObserverEnabled,
        ]
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Fuerza el retorno al bundle nativo al actualizar una instalación que
        // pudiera tener pendiente el OTA incorrecto de Suya Cliente.
        versionCode 8
        versionName "1.7"
        buildConfigField "String", "SUYA_SUPABASE_URL", "\"${suyaSupabaseUrl}\""
        buildConfigField "String", "SUYA_SUPABASE_PUBLISHABLE_KEY", "\"${suyaSupabasePublishableKey}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (suyaReleaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
